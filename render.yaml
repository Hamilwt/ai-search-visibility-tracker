# Render Blueprint: FastAPI backend (free tier).
# Database lives on Neon (see README); paste its URL in the dashboard.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: visibility-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon POOLED URL, e.g. postgresql://user:pass@host-pooler/db?sslmode=require
      - key: DIRECT_DATABASE_URL
        sync: false # Neon DIRECT URL, used by preDeploy migrations only
      - key: CORS_ORIGINS
        sync: false # comma-separated, e.g. https://your-frontend.vercel.app
      - key: MAX_PROMPTS_PER_RUN
        value: 10
      - key: MAX_RUNS_PER_HOUR_PER_IP
        value: 5
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: LLM_TIMEOUT_S
        value: 60
      - key: MAX_CONCURRENT_LLM_CALLS
        value: 5
      - key: LANGFUSE_HOST
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
